<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Downloader</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <h1>YouTube Downloader</h1>
        <form id="downloadForm">
            <input type="text" id="urlInput" placeholder="Введите ссылку на YouTube видео" required />
            <div class="format-group">
                <label>
                    <input type="radio" name="format" value="mp4" checked /> Видео (MP4)
                </label>
                <label>
                    <input type="radio" name="format" value="mp3" /> Аудио (MP3)
                </label>
            </div>
            <button type="submit">Скачать</button>
        </form>
        <div id="status"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
